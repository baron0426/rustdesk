name: RustDesk WebSocket Windows test build
on:
  workflow_dispatch:
  push:
    branches: ['build/websocket-windows']
    paths: ['.github/workflows/windows-test-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
      - name: Get pinned source and apply both patches
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none --no-checkout https://github.com/rustdesk/rustdesk.git source
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          Set-Location source
          git checkout 0bc2473ffe95934408150d48633cd50344c55960
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Submodule initialization failed' }
          function Write-Patch($encoded, $name) {
            $inputStream = [IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
            $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
            $outputStream = [IO.MemoryStream]::new()
            $gzipStream.CopyTo($outputStream)
            [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP $name), $outputStream.ToArray())
            $gzipStream.Dispose(); $inputStream.Dispose(); $outputStream.Dispose()
          }
          Write-Patch '' 'rustdesk.patch'
          Write-Patch '' 'hbb.patch'
          git apply "$env:RUNNER_TEMP/rustdesk.patch"
          if ($LASTEXITCODE -ne 0) { throw 'RustDesk patch failed' }
          git -C libs/hbb_common apply "$env:RUNNER_TEMP/hbb.patch"
          if ($LASTEXITCODE -ne 0) { throw 'hbb_common patch failed' }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75.0'
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64
      - name: Prepare the official Flutter patches and Windows engine
        run: |
          $ErrorActionPreference = 'Stop'
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          $patchPath = Join-Path $env:GITHUB_WORKSPACE 'source/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
          git -C $flutterRoot apply $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Flutter patch failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'engine.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'engine'
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $extracted
          Copy-Item "$extracted/*" "$flutterRoot/bin/cache/artifacts/engine/windows-x64-release" -Recurse -Force
      - name: Build native dependencies
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg-rustdesk'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $vcpkgRoot checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_INSTALLED_ROOT = "$vcpkgRoot/installed"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLED_ROOT=$vcpkgRoot/installed" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & "$vcpkgRoot/vcpkg.exe" install --triplet x64-windows-static --host-triplet x64-windows-static "--x-install-root=$vcpkgRoot/installed"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency build failed' }
      - name: Generate the Rust and Flutter bridge
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-expand --version 1.0.95 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-expand installation failed' }
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          if ($LASTEXITCODE -ne 0) { throw 'Bridge generator installation failed' }
          Push-Location flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          Pop-Location
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          if ($LASTEXITCODE -ne 0) { throw 'Bridge generation failed' }
      - name: Build the Windows x64 application
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          python build.py --flutter --skip-portable-pack
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $release = 'flutter/build/windows/x64/runner/Release'
          foreach ($file in @('rustdesk.exe', 'librustdesk.dll', 'flutter_windows.dll', 'data')) {
            if (!(Test-Path "$release/$file")) { throw "Missing output: $file" }
          }
      - name: Upload the complete test application
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-websocket-windows-x64
          path: source/flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7